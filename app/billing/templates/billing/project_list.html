{% extends "billing/base.html" %}

{% block title %}Projects{% endblock %}

{% block content %}
  <h1>Projects</h1>
  <table>
    <thead>
      <tr>
        <th>Project</th>
        <th>Client</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for project in projects %}
        <tr>
          <td>{{ project.name }}</td>
          <td>{{ project.client.name }}</td>
          <td>{{ project.status }}</td>
          <td><a href="{% url 'billing:project_detail' project.id %}">Open</a></td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="4">No projects found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
