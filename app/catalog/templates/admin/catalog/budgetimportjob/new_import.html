{% extends "admin/base_site.html" %}

{% block content %}
  <h1>{{ title }}</h1>
  <p>
    <a class="button" href="{% url 'admin:catalog_budgetimportjob_download_template' %}">Baixar modelo CSV</a>
  </p>
  <p>Use o modelo oficial para manter o cabeçalho e o separador esperados pelo importador.</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset class="module aligned">
      {{ form.as_p }}
    </fieldset>
    <div class="submit-row">
      <input type="submit" class="default" value="Gerar Preview">
    </div>
  </form>
{% endblock %}
