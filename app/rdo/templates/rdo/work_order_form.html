{% extends "billing/base.html" %}

{% block title %}Livro de Ordem - {{ project.name }}{% endblock %}

{% block content %}
  <h1>Livro de Ordem - {{ project.name }}</h1>

  <div class="actions">
    <a href="{% url 'billing:project_detail' project.id %}">Voltar para obra</a>
    <a href="{% url 'rdo:project_rdo_list' project.id %}">RDO</a>
  </div>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar Livro de Ordem</button>
  </form>
{% endblock %}
