{% extends "billing/base.html" %}

{% block title %}Novo diario{% endblock %}

{% block content %}
  <h1>Novo diario - {{ project.name }}</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Criar diario</button>
  </form>

  <p><a href="{% url 'rdo:project_rdo_list' project.id %}">Voltar para RDO</a></p>
{% endblock %}
