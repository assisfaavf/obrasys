services:
  db:
    ports: !reset []

  web:
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${OBRASYS_LOCAL_DB:-${POSTGRES_DB}}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DEBUG: "1"
      PORT: "8000"
    ports: !override
      - "127.0.0.1:8000:8000"
